# SmartTodo CI — automated quality gate for every pull request and push to main.
#
# This workflow is a VALIDATION GATE ONLY. It deliberately contains no deploy,
# release, or database-migration step: the application is deployed separately
# (Vercel) and Supabase migrations are applied manually, so nothing here can
# change production state.
#
# It runs the repository's own npm scripts unchanged. Each step fails the job on
# a non-zero exit code, so a broken test, type error, lint violation, or failed
# production build blocks the change.
name: SmartTodo CI

# Two triggers only:
#   pull_request — validates a proposed change before it can be merged.
#   push to main  — a post-merge/post-push validation gate.
# Other events (tags, forks' internal branches) are intentionally excluded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-progress run for the same ref, so a superseded
# build cannot report a misleading result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  ci:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node 20 LTS. Chosen because it satisfies every engine constraint in
        # the dependency tree: vite ^18 || >=20, vitest ^18 || ^20 || >=22,
        # eslint ^18.18 || ^20.9 || >=21.1, typescript >=14.17. Pinned to a
        # major so CI resolves the latest 20.x LTS patch.
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Caches the npm download cache keyed on package-lock.json. This only
          # speeds up downloads; `npm ci` below still installs strictly the
          # versions in the lockfile, so a stale cache cannot change results.
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly what the committed
      # package-lock.json pins, and fails outright if that lockfile is out of
      # sync with package.json. No credentials or environment variables are
      # needed, because the test suite is fully self-contained.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      # Compile-only. There is intentionally no deploy step here: production
      # delivery stays a separate, manual concern.
      - name: Build for production
        run: npm run build

  database-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    # Longer than the application job because this one boots a real Postgres
    # container and applies 26 migrations from scratch on every run. The bound
    # still guarantees a hung Supabase startup fails the job rather than hanging.
    timeout-minutes: 20

    env:
      # Pinned to the version the RUNBOOK documents (`npx supabase@2.117.0`), so
      # the local stack, migration application and test runner are reproducible
      # rather than drifting with the latest release.
      SUPABASE_CLI_VERSION: '2.117.0'
      # Keep the CLI entirely non-interactive: it would otherwise prompt for
      # telemetry consent and block the job on a runner with no TTY.
      DO_NOT_TRACK: '1'
      # Local-only container ports. These are the Supabase CLI's own defaults for
      # a self-hosted stack and are never published to the internet; they exist
      # only inside this ephemeral runner.
      POSTGRES_PORT: '54322'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Same Node 20 LTS as the application job, for the npx-installed CLI.
        # No `cache: npm` here: this job never runs `npm ci`, so there is no
        # lockfile install to accelerate and no cache to go stale.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Starts a DISPOSABLE local Supabase stack: a throwaway Postgres container
      # on this ephemeral runner. It is never linked to a remote project, needs
      # no credentials, and disappears with the runner. This is the same
      # `supabase start` flow the RUNBOOK documents for running the pgTAP suites.
      - name: Start local Supabase
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} start --yes

      # Applies every migration in supabase/migrations/ to the disposable
      # database. Migrations remain the single source of truth: nothing here
      # recreates the schema by hand, and a failing migration fails the job.
      - name: Apply migrations
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} db reset --local --yes

      # Runs ALL six existing pgTAP suites from supabase/tests/ via the Supabase
      # CLI's own pgTAP runner. The suites are executed exactly as committed —
      # no assertion is modified, filtered, or skipped, and the runner exits
      # non-zero if any of them fail. Every suite is wrapped in BEGIN/ROLLBACK,
      # so the database is left as the migrations defined it.
      - name: Run pgTAP database tests
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} test db --local supabase/tests

      # Stops the stack even when an earlier step failed, so no container is left
      # running. Deliberately allowed to fail: the job is already failing if this
      # point is reached via a prior error, and a teardown problem must never
      # mask the real failure.
      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: npx --yes supabase@${{ env.SUPABASE_CLI_VERSION }} stop --yes
